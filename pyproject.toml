[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsqlex"
version = "0.1.0"
description = "A SQL-like DSL for evaluating dynamic financial calculations"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dsqlex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
